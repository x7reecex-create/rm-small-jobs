<!doctype html>
<html lang="en-GB">
<head>

<title>RM Small Jobs | Private business app</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#061a2b;--orange:#f46b20;--bg:#f5f2eb;--text:#14222d;--muted:#53616a;--line:#dce2e5;--danger:#a92117}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}a{color:inherit}button,a,input,textarea,select{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}
header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}.head{max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{display:block;width:76px;height:auto;flex:0 0 auto;filter:url(#logoCutout)}.brand b{display:block;font-size:16px}.brand small{display:block;color:#bfced6;font-size:12px}.head .btn{font-size:14px;padding:8px 12px}
main{max-width:1040px;margin:auto;padding:24px 16px calc(108px + env(safe-area-inset-bottom))}h1{font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-1px;margin:0 0 10px}h2{font-size:21px;line-height:1.3;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:10px 0}.muted{color:var(--muted);font-size:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:14px}.stat b{display:block;font-size:29px;margin-top:4px;color:var(--navy)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.split .card{margin-top:0}.auth{max-width:520px;padding-top:40px}.auth .logo{width:104px;margin-bottom:24px;background:var(--navy);filter:none}.field{margin:14px 0}.field label{display:block;font-size:14px;font-weight:750;color:var(--muted);margin-bottom:6px}input,textarea,select{width:100%;min-height:48px;padding:12px;border:1px solid #bcc8ce;border-radius:9px;background:#fff;color:var(--text)}textarea{resize:vertical}.check{display:flex;align-items:center;gap:12px;min-height:44px;margin:12px 0}.check input{width:24px;min-height:24px;height:24px;flex:0 0 auto}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font-weight:750;text-decoration:none;text-align:center}.primary{background:var(--orange);color:var(--navy)}.secondary{background:#fff;color:var(--text);border-color:#bcc8ce}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions h2{flex:1;margin:0}.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 12px;margin-bottom:12px}.tab{min-height:44px;white-space:nowrap;border:1px solid #bcc8ce;background:#fff;border-radius:99px;padding:8px 14px;font-size:14px;font-weight:750}.tab.on{background:var(--navy);color:#fff}.row{border-top:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}.row:first-child{border-top:0}.row .actions{justify-content:space-between;margin-top:10px}.row b{font-size:17px}.badge{display:inline-block;background:#eef1f2;padding:3px 9px;border-radius:6px;color:var(--muted);font-size:13px}.preview{background:var(--navy);color:#fff;border-radius:13px;padding:20px;overflow-wrap:anywhere}.preview small{color:#bfced6}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}.nav button{min-height:54px;border:0;background:#fff;color:var(--muted);padding:8px 2px;font-size:13px;font-weight:750;border-radius:10px}.nav .on{background:#fff0e8;color:#a74611}.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50;font-size:14px;width:max-content;max-width:calc(100% - 32px);text-align:center}.error{background:#fff1f0;border:1px solid #efb8b2;color:var(--danger);padding:14px;border-radius:10px;margin:12px 0;overflow-wrap:anywhere}.notice{background:#eef1f2;border-left:4px solid var(--orange);padding:14px 16px;border-radius:10px;margin:16px 0;font-size:14px}.qr-block{display:flex;align-items:center;gap:14px}.qr-block>div{min-width:0;overflow-wrap:anywhere}.qr{display:block;width:100px;height:100px;flex:0 0 auto;image-rendering:pixelated}.service-list{padding-left:20px;color:var(--muted);font-size:14px}.service-list li{margin:6px 0}.inline-link{display:inline-flex;align-items:center;min-height:44px}.empty{color:var(--muted);padding:10px 0}.form-error:empty{display:none}
@media(min-width:800px){.nav{position:sticky;top:76px;max-width:1040px;margin:auto;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:9}.nav button{min-height:44px}main{padding-bottom:40px}.toast{bottom:24px}}
@media(max-width:380px){.nav button{font-size:11px}.qr-block{flex-direction:column;align-items:flex-start}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr;gap:0}.card{padding:18px}.brand b{font-size:14px}.brand small{font-size:11px}.logo{width:62px}.head{gap:8px}.auth{padding-top:24px}.actions>.btn{flex:1 1 auto}}
main,h1,h2,h3{overflow-wrap:anywhere}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}.wide{grid-column:1/-1}.danger{background:#fff1f0;border-color:#efb8b2;color:#a92117}.search{max-width:540px}.row-title{display:flex;justify-content:space-between;gap:12px;align-items:start}.status{font-size:13px;white-space:normal}.subnav{margin:16px 0}.compact{margin:8px 0}.note{white-space:pre-wrap;overflow-wrap:anywhere}.tools-links{margin-bottom:20px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.stat b{font-size:25px;overflow-wrap:anywhere}.row-title{flex-wrap:wrap}}
</style>
