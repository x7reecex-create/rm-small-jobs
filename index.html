<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RM Small Jobs | Website Maintenance</title>

<style>
:root {
  --navy: #061A2B;
  --orange: #F46B20;
  --cream: #F5F2EB;
  --white: #ffffff;
  --muted: #aebcc4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--navy);
  color: var(--white);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: min(600px, calc(100% - 40px));
  text-align: center;
}

.logo {
  width: 120px;
  margin: 0 auto 35px;
}

.badge {
  display: inline-block;
  color: var(--orange);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 18px;
}

h1 {
  font-size: clamp(42px, 9vw, 72px);
  line-height: .95;
  letter-spacing: -3px;
  margin: 0 0 22px;
}

h1 span {
  color: var(--orange);
}

p {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.6;
  margin: 0 auto 30px;
  max-width: 480px;
}

.line {
  width: 50px;
  height: 3px;
  background: var(--orange);
  margin: 0 auto 30px;
}

.footer {
  margin-top: 50px;
  font-size: 11px;
  color: #71838e;
  font-weight: 700;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<main class="container">

  <img class="logo" src="logo.png" alt="RM Small Jobs">

  <div class="badge">WEBSITE MAINTENANCE</div>

  <h1>
    Back soon.<br>
    <span>We're updating things.</span>
  </h1>

  <div class="line"></div>

  <p>
    The RM Small Jobs website is currently being updated.
    Please check back shortly.
  </p>

  <div class="footer">
    RM SMALL JOBS · SMALL JOBS. DONE PROPERLY.
  </div>

</main>

</body>
</html>
